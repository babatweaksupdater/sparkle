name: Build and publish Baba Tweak update
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set version and GitHub release target
        id: version
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $parts = $package.version.Split('.')
          $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          $tag = "v$version"
          git tag $tag
          git push origin $tag
          npm version $version --no-git-tag-version
          Add-Content $env:GITHUB_OUTPUT "version=$version"
          node -e "const fs=require('fs');const p=require('./package.json');const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/');p.build.publish[0].owner=owner;p.build.publish[0].repo=repo;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: npm install
      - name: Build Windows installer and updater files
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure installer and updater metadata are attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $installer = Get-ChildItem release -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*.__uninstaller.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $blockmap = Get-Item ($installer.FullName + '.blockmap') -ErrorAction SilentlyContinue
          $metadata = Get-Item 'release/latest.yml' -ErrorAction SilentlyContinue
          if (-not $blockmap) { throw 'Installer blockmap is missing.' }
          if (-not $metadata) { throw 'Update metadata latest.yml is missing.' }
          $uploadDir = Join-Path $env:RUNNER_TEMP "baba-tweak-release-$version"
          New-Item -ItemType Directory -Force -Path $uploadDir | Out-Null
          $uploadExe = Join-Path $uploadDir "Baba-Tweak-Setup-$version.exe"
          $uploadBlockmap = "$uploadExe.blockmap"
          Copy-Item -LiteralPath $installer.FullName -Destination $uploadExe
          Copy-Item -LiteralPath $blockmap.FullName -Destination $uploadBlockmap
          Copy-Item -LiteralPath $metadata.FullName -Destination (Join-Path $uploadDir 'latest.yml')
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Baba Tweak $version" --notes "Baba Tweak automatic update release $version"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release.' }
          }
          gh release upload $tag $uploadExe $uploadBlockmap (Join-Path $uploadDir 'latest.yml') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload all updater assets to the GitHub release.' }

